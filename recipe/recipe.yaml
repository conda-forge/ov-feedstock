context:
  version: "0.55.0"

package:
  name: ov
  version: "${{ version }}"

source:
  url: https://github.com/noborus/ov/archive/refs/tags/v${{ version }}.tar.gz
  sha256: a715b1ef3e8a4d4525155a4d30458d44b2aab2c9741fe89dea8bfd3640691bb5

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - if: unix
        then:
          - ov --version | grep "${PKG_VERSION}"
      - if: win
        then:
          - ov --version | findstr "%PKG_VERSION%"
  - package_contents:
      bin:
        - ov
      files:
        - if: unix
          then:
            - share/bash-completion/completions/ov
            - share/zsh/site-functions/_ov
            - share/fish/vendor_completions.d/ov.fish
        - if: win
          then:
            - share/powershell/completions/ov.ps1
about:
  homepage: https://github.com/noborus/ov
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: "A feature-rich terminal-based pager"
  description: "Feature-rich terminal-based text viewer written in go. It is a so-called terminal pager."

extra:
  recipe-maintainers:
    - sabarish-vm
